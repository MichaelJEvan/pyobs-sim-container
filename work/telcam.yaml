{include _environment.yaml}

# One process running both modules, each with its own XMPP account.
class: pyobs.modules.MultiModule

# The vfs must live HERE, not on the camera module below: get_object's
# own-vfs check looks for "_vfs" while YAML defines "vfs", so a child's
# vfs config is silently replaced by the parent's (measured 2026-08-31,
# pyobs-core 2.1.0). At top level the parent IS the one with the cache
# root and the children inherit it, which sidesteps the bug.
vfs:
  class: pyobs.vfs.VirtualFileSystem
  roots:
    cache:
      class: pyobs.vfs.LocalFile
      root: /work/cache

modules:

  telescope:
    # 2.0 split DummyTelescope into DummyRaDecTelescope / DummyAltAzTelescope /
    # DummySolarTelescope. SimWorld and SimTelescope are gone -- position and
    # speed are arguments to the module itself now, so there is no shared world.
    class: pyobs.modules.telescope.DummyRaDecTelescope
    position: [37.954, 89.264]     # Polaris, where the 1.54 sim also started
    speed: 3.0                     # degrees/sec, as on the HP
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: telescope@localhost
      server: ejabberd:5222        # a separate container: the JID domain is not
      password: pyobs              # the network address

  camera:
    class: pyobs.modules.camera.DummyCamera
    telescope: telescope           # named module, not a shared world object
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: camera@localhost
      server: ejabberd:5222
      password: pyobs

  # The rest of the closet: every dummy pyobs ships, one XMPP account each,
  # all self-contained (constructors need no references). Here so every
  # client (pyobs-gui, Polaris, NorthStar someday) has a full observatory
  # to discover.

  roof:
    class: pyobs.modules.roof.DummyRoof
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: roof@localhost
      server: ejabberd:5222
      password: pyobs

  scheduler:
    class: pyobs.modules.robotic.DummyScheduler
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: scheduler@localhost
      server: ejabberd:5222
      password: pyobs

  mastermind:
    class: pyobs.modules.robotic.DummyMastermind
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: mastermind@localhost
      server: ejabberd:5222
      password: pyobs

  autofocus:
    class: pyobs.modules.focus.DummyAutoFocus
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: autofocus@localhost
      server: ejabberd:5222
      password: pyobs

  guiding:
    class: pyobs.modules.pointing.DummyAutoGuiding
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: guiding@localhost
      server: ejabberd:5222
      password: pyobs

  acquisition:
    class: pyobs.modules.pointing.DummyAcquisition
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: acquisition@localhost
      server: ejabberd:5222
      password: pyobs

  solar:
    class: pyobs.modules.telescope.DummySolarTelescope
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: solar@localhost
      server: ejabberd:5222
      password: pyobs

  spectrograph:
    class: pyobs.modules.camera.DummySpectrograph
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: spectrograph@localhost
      server: ejabberd:5222
      password: pyobs

  video:
    # Not exported from pyobs.modules.camera like its siblings; full path needed.
    class: pyobs.modules.camera.dummyvideo.DummyVideo
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: video@localhost
      server: ejabberd:5222
      password: pyobs
