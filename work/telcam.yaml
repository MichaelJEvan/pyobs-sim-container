{include _environment.yaml}

# One process running both modules, each with its own XMPP account.
class: pyobs.modules.MultiModule

# The vfs must live HERE, not on the camera module below: get_object's
# own-vfs check looks for "_vfs" while YAML defines "vfs", so a child's
# vfs config is silently replaced by the parent's (measured 2026-08-31,
# pyobs-core 2.1.0). At top level the parent IS the one with the cache
# root and the children inherit it, which sidesteps the bug.
vfs:
  class: pyobs.vfs.VirtualFileSystem
  roots:
    cache:
      class: pyobs.vfs.LocalFile
      root: /work/cache

modules:

  telescope:
    # 2.0 split DummyTelescope into DummyRaDecTelescope / DummyAltAzTelescope /
    # DummySolarTelescope. SimWorld and SimTelescope are gone -- position and
    # speed are arguments to the module itself now, so there is no shared world.
    class: pyobs.modules.telescope.DummyRaDecTelescope
    position: [37.954, 89.264]     # Polaris, where the 1.54 sim also started
    speed: 3.0                     # degrees/sec, as on the HP
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: telescope@localhost
      server: ejabberd:5222        # a separate container: the JID domain is not
      password: pyobs              # the network address

  camera:
    class: pyobs.modules.camera.DummyCamera
    telescope: telescope           # named module, not a shared world object
    comm:
      class: pyobs.comm.xmpp.XmppComm
      jid: camera@localhost
      server: ejabberd:5222
      password: pyobs
